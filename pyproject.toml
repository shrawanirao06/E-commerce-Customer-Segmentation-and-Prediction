[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-segmentation"
version = "0.2.0"
description = "RFM customer segmentation + future-purchase prediction for an e-commerce transaction log"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn==1.7.2",
    "joblib==1.5.2",
]

[project.optional-dependencies]
app = ["streamlit"]
notebook = ["jupyter", "matplotlib", "seaborn"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
